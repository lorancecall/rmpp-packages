# Installed by rmpp-preload: the only rmpp file outside /usr/lib/rmpp. Starts xochitl through the launcher, so
# rmpp add-ons load at boot; plain xochitl when the launcher is gone.
# Never order xochitl after home.mount: on the Paper Pro the encrypted /home is unlocked only once xochitl runs,
# and that ordering leaves the tablet on the boot logo.
[Service]
ExecStart=
ExecStart=/bin/sh -c 'l=/usr/lib/rmpp/launch; if [ -x "$$l" ]; then exec "$$l" /usr/bin/xochitl --system; fi; exec /usr/bin/xochitl --system'
