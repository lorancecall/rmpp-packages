# Installed by rmpp-preload: the only rmpp file on the root file system. Starts xochitl through the launcher in
# /home when it is there, else plain xochitl (so a factory reset, which wipes /home, leaves a stock tablet).
[Service]
ExecStart=
ExecStart=/bin/sh -c 'l=/home/root/.vellum/share/rmpp-preload/launch; if [ -x "$$l" ]; then exec "$$l" /usr/bin/xochitl --system; fi; exec /usr/bin/xochitl --system'
