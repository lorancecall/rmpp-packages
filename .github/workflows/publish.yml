name: Build and publish packages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # an add-on repository announces a release (gh workflow run, or repository_dispatch "rmpp-release"); the daily run
  # picks up new add-ons and new versions in any case (scripts/registry.py)
  repository_dispatch:
    types: [rmpp-release]
  schedule:
    - cron: "37 4 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install vbuild
        run: |
          sudo curl -sfL https://github.com/Eeems/vbuild/releases/download/0.0.36/vbuild-x86_64-glibc -o /usr/local/bin/vbuild
          sudo chmod +x /usr/local/bin/vbuild

      - name: Signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          printf '%s\n' "$SIGNING_KEY" > keys/lorancecall-rmpp.rsa
          chmod 600 keys/lorancecall-rmpp.rsa

      - name: Add-ons from their repositories (topic rmpp)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/registry.py

      - name: rmpp-lang language add-on packages
        run: |
          pip install -q pyside6-essentials==6.10.1
          RCC=pyside6-rcc python3 scripts/lang-addons.py

      - name: docs/packages.md is current
        if: github.event_name == 'pull_request'
        run: python3 scripts/packages-doc.py --check

      - name: Build packages
        run: |
          for p in packages/*/; do ./scripts/build-package.sh "$(basename "$p")"; done

      # A published version never changes its bytes: a tablet with a cached index checks the apk's hash ("v2 package
      # integrity error" otherwise). Builds are reproducible, but a new rmpp-lang ref or vbuild can still change the
      # bytes of an unchanged version, so the published apk of the same file name wins. A changed package needs a
      # new version (plain versions); the log names the packages whose new build differs.
      - name: Keep published packages of the same version
        run: |
          for f in dist/*/*.apk; do
            n=$(basename "$f")
            curl -sfL -o pub.apk "https://lorancecall.github.io/rmpp-packages/aarch64/$n" || { echo "new: $n"; continue; }
            if cmp -s pub.apk "$f"; then echo "same: $n"; else echo "kept the published $n (this build differs)"; cp pub.apk "$f"; fi
          done
          rm -f pub.apk

      - name: Make the aarch64 repository
        run: |
          mkdir -p site/aarch64
          cp dist/aarch64/*.apk dist/noarch/*.apk site/aarch64/ 2>/dev/null || true
          docker run --rm -v "$PWD/site/aarch64:/packages" -v "$PWD/keys:/keys:ro" -w /packages \
            ghcr.io/eeems/vbuild-builder:main sh -c "
              cp /keys/lorancecall-rmpp.rsa.pub /etc/apk/keys/
              apk index --rewrite-arch aarch64 -o APKINDEX.tar.gz *.apk
              abuild-sign -k /keys/lorancecall-rmpp.rsa APKINDEX.tar.gz
              for f in *.apk; do apk verify \$f; done
              chown $(id -u):$(id -g) APKINDEX.tar.gz"
          cp keys/lorancecall-rmpp.rsa.pub site/
          cp install.sh installer/install-rmpp.sh installer/install-rmpp.ps1 installer/remove-rmpp.sh mods.txt site/
          mkdir -p site/addons && cp site-addons/*.txt addons/*.txt site/addons/
          ls -la site site/aarch64

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
