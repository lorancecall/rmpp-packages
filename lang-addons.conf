# Where scripts/lang-addons.py takes the rmpp-lang language add-ons from (languages/<code>/ of this repo at ref).
# Pin ref to the rmpp-lang release tag that the rmpp-lang package uses.
repo=lorancecall/rmpp-lang
ref=v0.3.6

# Licenses of data an add-on bundles besides rmpp-lang's own GPL-3.0-only (SPDX ids, space separated; fonts add
# "custom" by themselves). Keep in step with the add-on's README / manifest in rmpp-lang. OFL-1.1: the stroke glyph
# file (glyphs.rmgl) that every add-on ships since rmpp-lang 0.3.4 is derived from Noto fonts.
license.ko=BSD-3-Clause OFL-1.1
license.ja=GPL-2.0-or-later OFL-1.1
license.zh=LGPL-3.0-only Apache-2.0 OFL-1.1
license.ru=OFL-1.1
license.bg=OFL-1.1
