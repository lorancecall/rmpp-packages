# Where scripts/lang-addons.py takes the rmpp-lang language add-ons from (languages/<code>/ of this repo at ref).
# Pin ref to the rmpp-lang release tag that the rmpp-lang package uses.
repo=lorancecall/rmpp-lang
ref=v0.3.1

# Licenses of data an add-on bundles besides rmpp-lang's own GPL-3.0-only (SPDX ids, space separated; fonts add
# "custom" by themselves). Keep in step with the add-on's README / manifest in rmpp-lang.
license.ko=BSD-3-Clause
license.ja=GPL-2.0-or-later
license.zh=LGPL-3.0-only Apache-2.0
